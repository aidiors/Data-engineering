apiVersion: v1
kind: Pod
metadata:
  name: cpu-waiting
  namespace: hw5
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
  - name: task
    image: hw5-skills:1
    imagePullPolicy: Never
    args:
    - hold
    - --seconds
    - '900'
    resources:
      requests:
        cpu: 600m
        memory: 64Mi
      limits:
        cpu: 1500m
        memory: 128Mi
  priorityClassName: hw5-low
