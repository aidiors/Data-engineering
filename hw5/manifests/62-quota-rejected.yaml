apiVersion: v1
kind: Pod
metadata:
  name: quota-rejected
  namespace: hw5-quota
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
  - name: task
    image: hw5-skills:1
    imagePullPolicy: Never
    args:
    - hold
    - --seconds
    - '900'
    resources:
      requests:
        cpu: 300m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 128Mi
