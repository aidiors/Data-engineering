[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["hh", "storage", "tmp", "output", "sem-2"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"] # Direct script launch adds the repository to sys.path first.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
